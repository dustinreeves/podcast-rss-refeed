<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}Refeed{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v={{ css_version }}">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/static/icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#161514">
</head>
<body>
<main class="{% block main_class %}{% endblock %}">
  <header class="top">
    <div>
      <h1><a href="/" class="home"><img src="/static/icons/icon-192.png" alt="" class="logo" width="40" height="40">Refeed</a></h1>
      {% block subtitle %}{% endblock %}
    </div>
    {% if user %}
    <nav class="account-nav small" aria-label="Account">
      <span class="muted">Signed in as <strong>{{ user.username }}</strong></span>
      <a href="/listen">Listen</a>
      <a href="/account">Account</a>
      {% if user.is_admin %}<a href="/admin">Admin</a>{% endif %}
      <form method="post" action="/logout"><button type="submit" class="linklike">Sign out</button></form>
    </nav>
    {% endif %}
  </header>

  {% if msg %}<div class="flash" role="status">{{ msg }}</div>{% endif %}
  {% if error %}<div class="flash warn" role="alert">{{ error }}</div>{% endif %}

  {% block content %}{% endblock %}
</main>
<script>
  const fmt = new Intl.RelativeTimeFormat(undefined, {numeric: "auto"});
  const units = [["year", 31536000], ["month", 2592000], ["day", 86400], ["hour", 3600], ["minute", 60]];
  for (const el of document.querySelectorAll("time[data-ts]")) {
    const ts = parseFloat(el.dataset.ts) * 1000, diff = (ts - Date.now()) / 1000;
    const [unit, secs] = units.find(([, s]) => Math.abs(diff) >= s) || ["minute", 60];
    el.textContent = fmt.format(Math.round(diff / secs), unit);
    el.title = new Date(ts).toLocaleString();
  }
  for (const btn of document.querySelectorAll("[data-copy]")) {
    btn.addEventListener("click", () => {
      navigator.clipboard.writeText(document.getElementById(btn.dataset.copy).value).then(() => {
        btn.textContent = "Copied";
        setTimeout(() => (btn.textContent = "Copy"), 1500);
      });
    });
  }
  if (location.search.includes("msg=")) history.replaceState(null, "", location.pathname + location.hash);
</script>
</body>
</html>
